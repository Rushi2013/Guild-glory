name: Build Aurora Panel APK

# Pushing the Kivy app compiles it into an installable debug APK with buildozer.
# The first run takes ~25-35 min (SDK/NDK download + full python-for-android
# build); later runs reuse the cache and land around 6-10 min.

on:
  push:
    branches:
      - main
      - "arena/**"
    paths:
      - "aurora_panel/**"
      - "buildozer.spec"
      - ".github/workflows/build-apk.yml"
  pull_request:
    paths:
      - "aurora_panel/**"
      - "buildozer.spec"
  workflow_dispatch:

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Headless logic tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Byte-compile every module
        run: python -m compileall -q aurora_panel
      - name: Run simulation + store tests (no Kivy needed)
        run: python aurora_panel/tests/test_range_model.py

  apk:
    name: buildozer android debug
    runs-on: ubuntu-22.04
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git zip unzip openjdk-17-jdk autoconf automake libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev \
            libssl-dev ccache

      - name: Cache buildozer global directory
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-global-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-global-

      - name: Cache buildozer project directory
        uses: actions/cache@v4
        with:
          path: .buildozer
          key: buildozer-${{ github.run_id }}-${{ hashFiles('buildozer.spec', 'aurora_panel/**') }}
          restore-keys: |
            buildozer-${{ github.run_id }}-
            buildozer-

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install "cython==0.29.36" buildozer

      - name: Accept Android SDK licences
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
        continue-on-error: true

      - name: Build debug APK
        run: buildozer -v android debug

      - name: Show artifact
        run: ls -lh bin/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: aurora-panel-debug-apk
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 30
