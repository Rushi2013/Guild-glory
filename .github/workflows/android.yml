name: Android APK

on:
  push:
    branches:
      - main
      - 'arena/**'
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'android/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Aurora Float APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Ensure Android SDK 34 is installed
        run: |
          set +e
          SDKMANAGER="$(command -v sdkmanager)"
          if [ -z "$SDKMANAGER" ] && [ -n "$ANDROID_HOME" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi
          if [ -x "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1
            "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0" > /dev/null 2>&1
          fi
          echo "sdk step finished"

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Package artefact
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/aurora-float-1.0.apk
          ls -lh dist

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: aurora-float-apk
          path: android/dist/aurora-float-1.0.apk
          if-no-files-found: error
          retention-days: 90

      - name: Attach APK to the GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/aurora-float-1.0.apk \
            --title "Aurora Float ${GITHUB_REF_NAME}" \
            --notes "Installable APK built by GitHub Actions from android/." \
            --latest \
            || gh release upload "${GITHUB_REF_NAME}" dist/aurora-float-1.0.apk --clobber
